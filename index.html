<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  /* Keeps the page see-through inside Notion. If your Notion is in dark mode, add ?dark to the embed link */
  if (/[?&]dark\b/.test(location.search)) document.documentElement.style.colorScheme = "dark";
</script>
<style>
  .widget { width:100%; max-width:228px; padding:18px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .gear { position:absolute; top:12px; right:12px; padding:5px 6px; font-size:13px; }
  .cat { position:relative; width:128px; aspect-ratio:2 / 1; margin-top:4px; }
  .cat img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; image-rendering:auto; }
  .hidden { visibility:hidden; }
  .mode { font-size:15px; font-weight:600; padding:3px 8px; background:var(--mode); box-shadow:0 0 0 2px var(--ink); }
  .time { font-family:var(--title); font-size:28px; line-height:1; margin:6px 0 2px; color:var(--forest); }
  .row { display:flex; gap:2px; margin-top:6px; }
  .row .px-btn { padding:7px 9px; font-size:14px; }
  .progress { font-size:14px; color:var(--moss); margin-top:4px; }
  .px-dots { max-width:190px; }

  .settings { display:none; width:100%; flex-direction:column; gap:10px; padding-top:18px; text-align:left; }
  .settings.open { display:flex; }
  .settings.open ~ .timer-view { display:none; }
  .settings h2 { font-family:var(--title); font-size:11px; font-weight:400; color:var(--forest); }
  .field { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:15px; }
  .field small { display:block; color:var(--moss); font-size:12px; }
  .field input { width:58px; font-family:var(--pixel); font-size:15px; text-align:center; color:var(--ink);
                 background:var(--pale); border:0; padding:4px; box-shadow:0 0 0 2px var(--ink), inset 2px 2px 0 rgba(22,47,44,.15); }
  .field input:focus-visible { outline:3px dashed var(--glow); outline-offset:3px; }
  .settings .row { justify-content:flex-end; }
  .timer-view { display:flex; flex-direction:column; align-items:center; gap:6px; }
</style>
</head>
<body>
<div class="widget px-card" id="w" style="--mode:var(--pink)">
  <button class="gear px-btn" id="gear" aria-label="Timer settings" title="Settings">⚙</button>

  <form class="settings" id="settings" onsubmit="return false">
    <h2>Timer settings</h2>
    <label class="field">Focus <small>minutes</small><input type="number" id="s-focus" min="1" max="180"></label>
    <label class="field">Short break <small>minutes</small><input type="number" id="s-short" min="1" max="60"></label>
    <label class="field">Long break <small>minutes</small><input type="number" id="s-long" min="1" max="120"></label>
    <label class="field">Long break every <small>sessions</small><input type="number" id="s-every" min="1" max="12"></label>
    <label class="field">Sessions to run <small>0 = keep going</small><input type="number" id="s-total" min="0" max="24"></label>
    <div class="row">
      <button type="button" class="px-btn" id="cancel">Cancel</button>
      <button type="button" class="px-btn primary" id="save">Save</button>
    </div>
  </form>

  <div class="timer-view">
    <div class="cat" aria-hidden="true">
      <img src="cat/fur_white_base.svg" alt="">
      <img id="pawL" src="cat/fur_white_left-up.svg" alt="">
      <img src="cat/face_pilot.svg" alt="">
      <img id="pawR" src="cat/fur_white_right-up.svg" alt="">
    </div>
    <div class="mode" id="mode">Focus</div>
    <div class="time" id="time" role="timer">25:00</div>
    <div class="row">
      <button class="px-btn primary" id="go">Start</button>
      <button class="px-btn" id="skip">Skip</button>
      <button class="px-btn" id="reset">Reset</button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="px-dots" id="dots"></div>
  </div>
</div>
<script>
  const DEFAULTS = { focus:25, short:5, long:15, every:4, total:4 };
  const LABEL = { focus:"Focus", short:"Short break", long:"Long break", done:"All done ♥" };
  const $ = id => document.getElementById(id);

  function load() {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("catPomodoro") || "{}") }; }
    catch (e) { return { ...DEFAULTS }; }
  }
  function persist() { try { localStorage.setItem("catPomodoro", JSON.stringify(cfg)); } catch (e) {} }

  let cfg = load();
  let mode = "focus", done = 0, left = cfg.focus * 60, end = null, tick = null, tap = null, flip = false;

  function paint() {
    const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
    $("time").textContent = mode === "done" ? "Yay!" : `${m}:${s}`;
    $("mode").textContent = LABEL[mode];
    $("w").style.setProperty("--mode", mode === "short" || mode === "long" ? "var(--sky)" : "var(--pink)");
    $("go").textContent = end ? "Pause" : "Start";
    $("go").disabled = $("skip").disabled = mode === "done";

    const count = cfg.total > 0 ? cfg.total : cfg.every;
    const filled = cfg.total > 0 ? done : (done % cfg.every || (done && mode === "long" ? cfg.every : 0));
    $("dots").innerHTML = Array.from({ length: count }, (_, i) => `<span class="${i < filled ? "on" : ""}"></span>`).join("");
    $("progress").textContent = cfg.total > 0 ? `${Math.min(done, cfg.total)} of ${cfg.total} sessions` : `${done} sessions done`;
    document.title = end ? `${m}:${s} ${LABEL[mode]}` : "Cat Pomodoro";
  }

  // The cat taps its paws while a focus session runs and rests with paws up otherwise
  function paws(on) {
    clearInterval(tap);
    $("pawL").classList.remove("hidden"); $("pawR").classList.remove("hidden");
    if (!on || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    tap = setInterval(() => { flip = !flip; $("pawL").classList.toggle("hidden", flip); $("pawR").classList.toggle("hidden", !flip); }, 350);
  }

  // an 8-bit style two-note chime
  function chime() {
    try {
      const a = new AudioContext();
      [[660, 0], [990, .16]].forEach(([f, t]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(.08, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .35);
        o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .4);
      });
    } catch (e) {}
  }

  function stop() { clearInterval(tick); end = null; paws(false); }

  function next() {
    stop();
    if (mode === "focus") {
      done++;
      if (cfg.total > 0 && done >= cfg.total) { mode = "done"; left = 0; paint(); return; }
      mode = done % cfg.every === 0 ? "long" : "short";
    } else mode = "focus";
    left = cfg[mode] * 60; paint();
  }

  function start() {
    end = Date.now() + left * 1000;
    paws(mode === "focus");
    tick = setInterval(() => {
      left = Math.max(0, Math.round((end - Date.now()) / 1000));
      if (left === 0) { chime(); next(); } else paint();
    }, 250);
    paint();
  }

  function reset() { stop(); mode = "focus"; done = 0; left = cfg.focus * 60; paint(); }

  const keys = ["focus", "short", "long", "every", "total"];
  function openSettings(open) {
    $("settings").classList.toggle("open", open);
    if (open) keys.forEach(k => $("s-" + k).value = cfg[k]);
  }
  $("gear").onclick = () => openSettings(!$("settings").classList.contains("open"));
  $("cancel").onclick = () => openSettings(false);
  $("save").onclick = () => {
    keys.forEach(k => {
      const el = $("s-" + k), n = Math.round(Number(el.value));
      cfg[k] = Number.isFinite(n) ? Math.min(Number(el.max), Math.max(Number(el.min), n)) : DEFAULTS[k];
    });
    persist(); openSettings(false); reset();
  };

  $("go").onclick = () => { if (end) { stop(); paint(); } else start(); };
  $("skip").onclick = next;
  $("reset").onclick = reset;
  paint();
</script>
<script>
  /* Shrinks the widget to fit the Notion embed, whatever size the embed is */
  (function () {
    const fit = () => {
      const card = document.querySelector(".px-card");
      if (!card) return;
      card.style.zoom = 1;
      const pad = 16, w = card.offsetWidth + pad, h = card.offsetHeight + pad;
      const s = Math.min(1, innerWidth / w, innerHeight / h);
      card.style.zoom = Math.max(.4, Math.floor(s * 50) / 50);
    };
    addEventListener("resize", fit);
    new ResizeObserver(fit).observe(document.body);
    if (document.fonts) document.fonts.ready.then(fit);
    addEventListener("load", fit);
    fit();
  })();
</script>
</body>
</html>
