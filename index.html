<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Pomodoro</title>
<style>
  :root { --bg:#fbf7fb; --ink:#3b3350; --soft:#8b82a3; --field:#fff; --focus:#f08aa6; --break:#6cc3b0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191919; --ink:#ece8f5; --soft:#9c95b3; --field:#252525; } }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
         display:grid; place-items:center; overflow:hidden; }
  .widget { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px;
            width:100%; max-width:240px; padding:8px; --mode:var(--focus); }
  .gear { position:absolute; top:4px; right:4px; background:none; border:0; padding:4px; cursor:pointer;
          color:var(--soft); font-size:18px; line-height:1; border-radius:6px; }
  .cat { position:relative; width:130px; aspect-ratio:1; }
  .cat img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .hidden { visibility:hidden; }
  .mode { font-size:13px; color:var(--mode); font-weight:600; }
  .time { font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1; }
  .row { display:flex; gap:6px; margin-top:6px; }
  button { font:inherit; font-size:13px; border:0; border-radius:999px; padding:5px 14px; cursor:pointer;
           background:var(--mode); color:#fff; }
  button.ghost { background:transparent; color:var(--soft); box-shadow:inset 0 0 0 1.5px var(--soft); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .progress { font-size:12px; color:var(--soft); margin-top:4px; }
  .dots { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; max-width:180px; }
  .dots span { width:6px; height:6px; border-radius:50%; background:var(--soft); opacity:.3; }
  .dots span.on { background:var(--focus); opacity:1; }

  .settings { display:none; width:100%; flex-direction:column; gap:8px; padding-top:22px; }
  .settings.open { display:flex; }
  .settings.open ~ .timer-view { display:none; }
  .settings h2 { font-size:15px; font-weight:600; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; }
  .field small { display:block; color:var(--soft); font-size:11px; }
  .field input { width:58px; font:inherit; font-size:14px; text-align:center; color:var(--ink);
                 background:var(--field); border:1.5px solid color-mix(in srgb, var(--soft) 40%, transparent);
                 border-radius:8px; padding:3px 4px; }
  .settings .row { justify-content:flex-end; }
</style>
</head>
<body>
<div class="widget" id="w">
  <button class="gear" id="gear" aria-label="Timer settings" title="Settings">⚙︎</button>

  <form class="settings" id="settings" onsubmit="return false">
    <h2>Timer settings</h2>
    <label class="field">Focus <small>minutes</small><input type="number" id="s-focus" min="1" max="180"></label>
    <label class="field">Short break <small>minutes</small><input type="number" id="s-short" min="1" max="60"></label>
    <label class="field">Long break <small>minutes</small><input type="number" id="s-long" min="1" max="120"></label>
    <label class="field">Long break every <small>sessions</small><input type="number" id="s-every" min="1" max="12"></label>
    <label class="field">Sessions to run <small>0 = keep going</small><input type="number" id="s-total" min="0" max="24"></label>
    <div class="row">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button type="button" id="save">Save</button>
    </div>
  </form>

  <div class="timer-view" style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div class="cat" aria-hidden="true">
      <img src="cat/fur_white_base.svg" alt="">
      <img id="pawL" src="cat/fur_white_left-up.svg" alt="">
      <img src="cat/face_pilot.svg" alt="">
      <img id="pawR" src="cat/fur_white_right-up.svg" alt="">
    </div>
    <div class="mode" id="mode">Focus</div>
    <div class="time" id="time" role="timer">25:00</div>
    <div class="row">
      <button id="go">Start</button>
      <button class="ghost" id="skip">Skip</button>
      <button class="ghost" id="reset">Reset</button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
  const DEFAULTS = { focus:25, short:5, long:15, every:4, total:4 };
  const LABEL = { focus:"Focus", short:"Short break", long:"Long break", done:"All done" };
  const $ = id => document.getElementById(id);

  function load() {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("catPomodoro") || "{}") }; }
    catch (e) { return { ...DEFAULTS }; }
  }
  function persist() { try { localStorage.setItem("catPomodoro", JSON.stringify(cfg)); } catch (e) {} }

  let cfg = load();
  let mode = "focus", done = 0, left = cfg.focus * 60, end = null, tick = null, tap = null, flip = false;

  function paint() {
    const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
    $("time").textContent = mode === "done" ? "🎉" : `${m}:${s}`;
    $("mode").textContent = LABEL[mode];
    $("w").style.setProperty("--mode", mode === "focus" || mode === "done" ? "var(--focus)" : "var(--break)");
    $("go").textContent = end ? "Pause" : "Start";
    $("go").disabled = $("skip").disabled = mode === "done";
    $("go").style.opacity = $("skip").style.opacity = mode === "done" ? .4 : 1;

    // Progress: one dot per session when a total is set, otherwise the current long-break cycle
    const count = cfg.total > 0 ? cfg.total : cfg.every;
    const filled = cfg.total > 0 ? done : (done % cfg.every || (done && mode === "long" ? cfg.every : 0));
    $("dots").innerHTML = Array.from({ length: count }, (_, i) => `<span class="${i < filled ? "on" : ""}"></span>`).join("");
    $("progress").textContent = cfg.total > 0 ? `${Math.min(done, cfg.total)} of ${cfg.total} sessions` : `${done} sessions done`;
    document.title = end ? `${m}:${s} · ${LABEL[mode]}` : "Cat Pomodoro";
  }

  // Cat taps its paws while a focus session runs, rests with paws up otherwise
  function paws(on) {
    clearInterval(tap);
    $("pawL").classList.remove("hidden"); $("pawR").classList.remove("hidden");
    if (!on || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    tap = setInterval(() => { flip = !flip; $("pawL").classList.toggle("hidden", flip); $("pawR").classList.toggle("hidden", !flip); }, 350);
  }

  function chime() {
    try {
      const a = new AudioContext(), o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.2, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, a.currentTime + 1);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 1);
    } catch (e) {}
  }

  function stop() { clearInterval(tick); end = null; paws(false); }

  function next() {
    stop();
    if (mode === "focus") {
      done++;
      if (cfg.total > 0 && done >= cfg.total) { mode = "done"; left = 0; paint(); return; }
      mode = done % cfg.every === 0 ? "long" : "short";
    } else mode = "focus";
    left = cfg[mode] * 60; paint();
  }

  function start() {
    end = Date.now() + left * 1000;
    paws(mode === "focus");
    tick = setInterval(() => {
      left = Math.max(0, Math.round((end - Date.now()) / 1000));
      if (left === 0) { chime(); next(); } else paint();
    }, 250);
    paint();
  }

  function reset() { stop(); mode = "focus"; done = 0; left = cfg.focus * 60; paint(); }

  // Settings panel
  const keys = ["focus", "short", "long", "every", "total"];
  function openSettings(open) {
    $("settings").classList.toggle("open", open);
    if (open) keys.forEach(k => $("s-" + k).value = cfg[k]);
  }
  $("gear").onclick = () => openSettings(!$("settings").classList.contains("open"));
  $("cancel").onclick = () => openSettings(false);
  $("save").onclick = () => {
    keys.forEach(k => {
      const el = $("s-" + k), n = Math.round(Number(el.value));
      const min = Number(el.min), max = Number(el.max);
      cfg[k] = Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : DEFAULTS[k];
    });
    persist(); openSettings(false); reset();
  };

  $("go").onclick = () => { if (end) { stop(); paint(); } else start(); };
  $("skip").onclick = next;
  $("reset").onclick = reset;
  paint();
</script>
</body>
</html>
